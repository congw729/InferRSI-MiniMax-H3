[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-omni-adapter"
version = "0.0.1"
description = "Experimental H3 loading integration for vLLM-Omni"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "numpy", "safetensors"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 110
